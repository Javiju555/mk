name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libgbm-dev libegl-dev libclang-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
