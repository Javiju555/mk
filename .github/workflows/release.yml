name: release

# A tag `vX.Y.Z` builds binaries for every platform and publishes them, with
# their sha256, in a GitHub Release. `workflow_dispatch` builds the same
# archives as run artifacts without publishing anything (dry run).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, bins: "mk mk-daemon", ext: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, bins: "mk.exe mk-daemon.exe", ext: zip }
          - { target: aarch64-apple-darwin, os: macos-latest, bins: "mk mk-daemon", ext: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-latest, bins: "mk mk-daemon", ext: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libgbm-dev libegl-dev libclang-dev libwayland-dev
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="mk-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          for bin in ${{ matrix.bins }}; do cp "target/${{ matrix.target }}/release/$bin" "$name/"; done
          cp LICENSE README.md "$name/"
          if [ "${{ matrix.ext }}" = zip ]; then 7z a "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name"; fi
          if command -v sha256sum >/dev/null; then sha256sum "$name.${{ matrix.ext }}" > "$name.${{ matrix.ext }}.sha256"
          else shasum -a 256 "$name.${{ matrix.ext }}" > "$name.${{ matrix.ext }}.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: mk-${{ matrix.target }}
          path: mk-*.*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
